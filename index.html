<script>
(function () {
  'use strict';
  let P = JSON.parse(document.getElementById('payload').textContent);
  const STORE = 'scm.k';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  let salt, iv, ct;
  const load = () => { salt = b64(P.salt); iv = b64(P.iv); ct = b64(P.ct); };
  load();
  const norm = s => String(s || '').trim().toLowerCase();

  /* 브라우저가 저장해 둔 이전 페이지(GitHub Pages 10분 캐시)일 수 있어, 열 때마다 서버의 최신 파일로 바꿔 쓴다 */
  async function latest() {
    try {
      const r = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
      const m = /<script id="payload" type="application\/json">([\s\S]*?)<\/script>/.exec(await r.text());
      if (r.ok && m) {
        const q = JSON.parse(m[1]);
        if (q.ct !== P.ct) { P = q; load(); const a = document.querySelector('.asof'); if (a && q.asof) a.textContent = '기준일시 ' + q.asof; }
      }
    } catch (e) { /* 오프라인 등: 저장된 페이지로 진행 */ }
  }

  /* 이메일과 단어로 감싼 키를 만들고, 명단 항목 중 풀리는 것이 있으면 그 안의 데이터 키로 본문을 푼다 */
  async function open(email, word) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(email) + '\n' + norm(word)), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let raw = null;
    for (const s of P.slots) {
      try { raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(s.iv) }, kek, b64(s.w)); break; } catch (e) { /* 다음 항목 */ }
    }
    if (!raw) throw new Error('no match');
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  /* 접속 기록: 대시보드 안의 기록 주소로 한 줄 전송. 같은 브라우저·이메일은 30분에 한 번만 */
  function record(html, email, method) {
    const m = /"access_log":\{"url":"([^"]+)","key":"([^"]+)"\}/.exec(html);
    if (!m) return;
    try {
      const last = JSON.parse(localStorage.getItem('scm.l') || 'null');
      if (last && last.e === norm(email) && Date.now() - last.t < 30 * 60 * 1000) return;
      localStorage.setItem('scm.l', JSON.stringify({ e: norm(email), t: Date.now() }));
    } catch (e) { /* 저장소 없음 */ }
    const body = JSON.stringify({ key: m[2], email: norm(email), method, ua: navigator.userAgent.slice(0, 160) });
    try {
      if (!(navigator.sendBeacon && navigator.sendBeacon(m[1], new Blob([body], { type: 'text/plain' })))) {
        fetch(m[1], { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body });
      }
    } catch (e) { /* 기록 실패는 열람에 영향 없음 */ }
  }

  /* 로그인 유지: 암호는 이 창(탭)에서만 기억해 새로고침은 그대로 열리고, 브라우저를 닫거나 새 탭이면 다시 묻는다.
     이메일은 입력 편의를 위해 기억한다. 암호를 쿠키에 두지 않는 것은 요청마다 서버로 전송되기 때문 */
  const EMAIL = 'scm.e';
  try { localStorage.removeItem(STORE); } catch (e) { /* 이전 방식(당일 자동 열기)의 저장값 정리 */ }

  async function attempt(email, word, remember, method) {
    try {
      const html = await open(email, word);
      try {
        if (remember) sessionStorage.setItem(STORE, JSON.stringify({ e: norm(email), w: norm(word), d: P.day }));
        localStorage.setItem(EMAIL, norm(email));
      } catch (e) { /* 저장소 없음 */ }
      record(html, email, method);
      show(html);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function start() {
    await latest();
    const q = new URLSearchParams(location.hash.slice(1));
    const le = q.get('e');
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);   // 링크의 이메일·(예전 링크의) 암호를 주소창에 남기지 않는다
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem(STORE) || 'null'); } catch (e) { /* 저장소 없음 */ }
    if (saved && saved.d === P.day && saved.e && (!le || norm(le) === saved.e) && await attempt(saved.e, saved.w, false, 'saved')) return;
    const f = document.getElementById('f'), e = document.getElementById('e'), k = document.getElementById('k'), b = document.getElementById('b'), m = document.getElementById('m');
    let known = '';
    try { known = localStorage.getItem(EMAIL) || ''; } catch (x) { /* 저장소 없음 */ }
    e.value = le || known;
    f.hidden = false;
    (e.value ? k : e).focus();
    f.addEventListener('submit', async ev => {
      ev.preventDefault();
      if (!e.value.trim()) { m.textContent = '이메일을 입력하세요'; e.focus(); return; }
      if (!k.value.trim()) { m.textContent = '암호를 입력하세요'; k.focus(); return; }
      b.disabled = true; m.textContent = ''; b.textContent = '확인 중';
      if (!(await attempt(e.value, k.value, true, le ? 'link' : 'input'))) {
        b.disabled = false; b.textContent = '열기';
        m.textContent = '이메일 또는 암호가 맞지 않습니다';
        k.select();
      }
    });
  }

  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    document.body.textContent = '이 브라우저에서는 열 수 없습니다. 최신 Chrome 또는 Edge로 열어 주세요.';
  } else {
    start();
  }
})();
